# Item 74: the type check of the plain-JS modules that start with
# `// @ts-check` (tsconfig.json; docs/TYPES.md says what is checked and how to
# add a file). A workflow of its own, so a type error is named as one and
# ci.yml is left alone. To require it before a merge: Settings → Branches →
# main → "Require status checks to pass" → `typecheck`.
name: Types

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check (tsc --noEmit)
        run: npm run typecheck
      - name: Every checked file still says // @ts-check
        run: node --test tests/typecheck.test.js

# Runs once per pull request into main (and again on each new push to it).
# A branch is merged into main only when this is green.
#
# Actions minutes cost money, so (24 Nov 2026):
#   - no run on a plain push: a branch is checked when its PR is opened, and
#     main is checked by deploy.yml, which runs the tests before deploying;
#   - the type check is a step here, not a workflow of its own (every job is
#     billed at least one minute);
#   - the three real-browser checks (informational, never blocking) run only
#     from the "Run workflow" button; run them on your own computer instead;
#   - the data rebuild in the container is reproducible.yml, which runs only
#     when a PR touches the data or the code that makes it.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:      # the "Run workflow" button: also runs the browser checks

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The exact Node of Dockerfile.build: the icons in dist/web/ go
          # through Node's zlib (tools/pwa.mjs).
          node-version: 22.23.4
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: No personal data or built files in the commit
        run: |
          bad=$(git ls-files | grep -E '^(server/data/|_prufa/|dist/|_backup/|_to_delete/)|(^|/)fallaskoli-v[0-9.]+\.html$|\.env$' || true)
          if [ -n "$bad" ]; then echo "These must not be committed:"; echo "$bad"; exit 1; fi

      # The generated data (data/*.js, data/lexicon.json, data/sentences.json …) is
      # committed. The Python half of ./build.sh regenerates it (the
      # `reproducible` job below does exactly that); this checks that what is
      # committed is what was last accepted.
      - name: Data manifest
        run: node tools/manifest.mjs

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Type check (tsc --noEmit, docs/TYPES.md)
        run: npm run typecheck

      - name: Bundle
        run: node tools/build.mjs

      # The real-browser checks from ./build.sh steps 7–8: only from the
      # "Run workflow" button (they take most of this job's time). Not
      # required: remove `continue-on-error` once they have passed here.
      - name: Browser test (Chromium)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tools/browser-test.mjs
      - name: Guided first run (Chromium)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tools/tour-test.mjs
      - name: Server + app test (Chromium)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tools/server-test.mjs

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: fallaskoli-html
          # The single file, and dist/web/ — the folder for a web host (item 54).
          path: |
            dist/*.html
            dist/web/
          retention-days: 14

# Keeps the website up to date by itself (WEBSITE.md).
#
# Every time `main` changes on GitHub — a merged pull request, or a push from
# "Update website.command" on the Mac — this tests that version, builds it and
# sends it to Fly.io. If a test fails, nothing is sent and the website keeps
# running the previous version. The pupils' data is on its own disk on Fly and
# is never touched by a deploy.
#
# Before the website exists (WEBSITE.md steps 1–3) this does nothing and stays
# green: it notices there is no FLY_API_TOKEN, or no app yet, and says so.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:      # the "Run workflow" button: deploy main again by hand

# One deploy at a time, in order. A newer push waits for the one running.
concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Is the website set up?
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice title=Website not set up yet::There is no FLY_API_TOKEN secret, so nothing was deployed. See WEBSITE.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.ok == 'true'

      - name: Does the app exist on Fly?
        id: app
        if: steps.token.outputs.ok == 'true'
        run: |
          APP="$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)"
          echo "name=$APP" >> "$GITHUB_OUTPUT"
          if flyctl status -a "$APP" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Website not set up yet::The Fly app '$APP' does not exist yet. Run the 'Set up website (once)' workflow first — WEBSITE.md step 3."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.ok == 'true'
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install
        if: steps.app.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund
      - name: Tests (nothing goes online if one fails)
        if: steps.app.outputs.ok == 'true'
        run: node --test tests/*.test.js
      - name: Build the program
        if: steps.app.outputs.ok == 'true'
        run: node tools/build.mjs

      - name: Send it to Fly.io
        if: steps.app.outputs.ok == 'true'
        # --ha=false: ONE machine, always (the data is files on one disk).
        run: flyctl deploy --remote-only --ha=false -a "${{ steps.app.outputs.name }}"

      - name: Check the website answers
        if: steps.app.outputs.ok == 'true'
        run: |
          URL="https://${{ steps.app.outputs.name }}.fly.dev"
          for _ in $(seq 1 20); do
            body="$(curl -fsS "$URL/health" || true)"
            case "$body" in *'"ok":true'*) echo "$body"; break;; esac
            sleep 6
          done
          case "$body" in *'"ok":true'*) ;; *) echo "::error::$URL/health did not answer ok"; exit 1;; esac
          v="$(node -p 'require("./package.json").version')"
          echo "### ✅ The website is updated" >> "$GITHUB_STEP_SUMMARY"
          echo "Version $v is live at $URL" >> "$GITHUB_STEP_SUMMARY"

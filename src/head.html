<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fallaskóli — íslensk málfræði</title>
<style>
/* The three typefaces are INSIDE this file (v6.3): tools/build.mjs replaces the
   next line with @font-face rules carrying the font data itself. Until then
   the page fetched them from Google's font service, which told Google the
   address of every child who opened it. Now the page asks nobody for anything. */
/*@@FONTS@@*/
/* ---------- the classroom (v6.2) ------------------------------------------
   Three surfaces and no more: the DESK (squared paper, behind everything), the
   SHEET (white paper — every card, table and chart) and the BOARD (the green
   board in the Æfa tab, where the question is written in chalk).

   The colour names are the ones the program has always used, because the
   scripts write `var(--lupine)` and friends straight into the charts. What
   they stand for now: lupine is ballpoint blue, moss a tick, rust the red pen,
   sulphur and marker the highlighter.

   `.blackboard` re-declares the same names as chalk colours further down, so every
   component drawn inside the board turns into chalk without a second rule —
   and `.blackboard .verdict` declares the paper values again, because the verdict
   is a note stuck on the board, not something written on it. */
:root,.blackboard .verdict{
  --paper:#E7ECF0; --paper-2:#F8FAFB; --sheet:#FFFFFF;
  --ink:#121922; --slate:#55657A; --line:#C7D1DA; --grid:#D7DFE6;
  --lupine:#3346C7; --lupine-soft:#E3E7FB; --moss:#1B7A55; --moss-soft:#DBEFE5;
  --rust:#C4372C; --rust-soft:#FADFDB; --sulphur:#B8860B; --sulphur-soft:#FFF4BF;
  --on-accent:#FFFFFF;
}
:root{
  --marker:#FFE65A;
  --board:#22392F; --board-deep:#172A22; --chalk:#F3F1E7; --chalk-dim:#A9BAAF;
  --chalk-yellow:#F2D96B; --wood:#D2B48A; --wood-deep:#B4925F;
  --radius:4px;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
/* Reading comfort (item 52, ui/dom.js applyComfort). A larger size, wider
   spacing between letters and words, and the proportional face where the
   monospaced one stood: `--mono` is the name every word form, input and table
   cell uses, so pointing it at the body face changes all of them at once.
   `zoom` scales the fixed pixel sizes in step, so nothing is left small. */
body.comfort{--mono:var(--body);letter-spacing:.04em;word-spacing:.1em;line-height:1.7}
body.comfort .wrap{zoom:1.15}
body.comfort .sentence,body.comfort .lemma,body.comfort .tile b,body.comfort h2.sec,
body.comfort .lsntitle,body.comfort .mystrip b{letter-spacing:.03em}
body.comfort input,body.comfort textarea,body.comfort button,body.comfort select{letter-spacing:inherit;word-spacing:inherit}
/* Text for screen readers only (item 51). */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html,body{margin:0;padding:0}
body{background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  /* rúðustrikað: the desk is a sheet of squared paper */
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 90px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:flex-end;gap:14px 28px;flex-wrap:wrap;padding:22px 0 14px}
.brand{margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.03em;margin:0;line-height:1}
/* The tagline is the school declined through its four cases, the way every
   child in the country has chanted a noun: hér er …, um …, frá …, til …. */
.brand p{margin:6px 0 0;font-size:13px;color:var(--slate)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius);padding:6px 12px 5px;line-height:1.2;min-width:74px}
.stat b{font-family:var(--mono);font-size:18px;font-weight:600;display:block}
.stat span{font-size:11.5px;color:var(--slate)}
.stat.flame b{color:var(--sulphur)}
.stat.xp b{color:var(--lupine)}
.levelbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.levelbar i{display:block;height:6px;background:var(--lupine);transition:width .4s ease}
.levelmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--slate);margin-top:6px;gap:10px;flex-wrap:wrap}
#lvlname{color:var(--ink);font-weight:600}
.diff{display:flex;align-items:center;gap:4px}
.diff span{margin-right:3px}
.diff i{width:14px;height:6px;background:var(--line);display:inline-block;border-radius:1px}
.diff i.on{background:var(--lupine)}

/* ---------- tabs: the dividers of a ring binder ----------
   One colour per divider, carried as a strip along its top edge. The open one
   is inked in; the rule under the row is the edge of the page they stick out
   over. */
nav.tabs{display:flex;gap:4px;margin:22px 0 26px;border-bottom:2px solid var(--ink)}
nav.tabs button{--tab:var(--slate);font-family:var(--body);font-size:14px;font-weight:600;line-height:1.25;
  background:var(--sheet);color:var(--ink);cursor:pointer;
  border:1px solid var(--line);border-bottom:none;border-top:4px solid var(--tab);
  border-radius:6px 6px 0 0;padding:9px 16px 10px}
nav.tabs button[data-view="practice"]{--tab:#2F7D5C}
nav.tabs button[data-view="map"]{--tab:var(--sulphur)}
nav.tabs button[data-view="progress"]{--tab:var(--marker)}
nav.tabs button[data-view="class"]{--tab:var(--lupine)}
nav.tabs button[data-view="settings"]{--tab:var(--slate)}
nav.tabs button:hover{background:var(--paper-2);border-color:var(--slate);border-top-color:var(--tab)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink);border-top-color:var(--tab)}
nav.tabs button:focus-visible{outline:2px solid var(--lupine);outline-offset:2px}
.view[hidden],.pane[hidden]{display:none}
body.gated .stats,body.gated .levelbar,body.gated .levelmeta,body.gated nav.tabs,body.gated #runbar,body.gated #duelbar{display:none}

/* ---------- task card ---------- */
.card{padding:14px 0 0}
.eyebrow{font-size:14px;color:var(--slate);margin:0 0 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.eyebrow b{color:var(--lupine);font-weight:600}
.sentence{font-family:var(--display);font-weight:500;font-size:clamp(21px,3.6vw,30px);line-height:1.4;letter-spacing:-.01em;margin:0}
.blank{display:inline-block;min-width:5ch;border-bottom:2px solid var(--lupine);color:var(--lupine);text-align:center}
.target{background:var(--sulphur-soft);border-bottom:3px solid var(--sulphur);padding:0 4px;border-radius:2px 2px 0 0}
.gloss{font-style:italic;color:var(--slate);margin:10px 0 0;font-size:14px}
.prompt-row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.lemma-box{flex:1 1 240px;min-width:0}
.lemma-label{font-size:13px;color:var(--slate)}
.lemma{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.lemma small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--slate);margin-left:8px}
.lemma .plus{color:var(--slate);font-weight:400;margin:0 6px}

/* ---------- 4x4 map ---------- */
.map{border-collapse:collapse;font-family:var(--mono);font-size:11.5px;flex:0 0 auto}
.map th{font-weight:500;color:var(--slate);padding:3px 6px;text-align:center;font-size:11px}
.map th.row{text-align:right;padding-right:8px}
.map td{width:22px;height:16px;border:1px solid var(--line);background:var(--sheet);padding:0}
.map td.on{background:var(--lupine);border-color:var(--lupine);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.map caption{caption-side:bottom;font-family:var(--body);font-size:11px;color:var(--slate);padding-top:6px}

/* ---------- inputs ---------- */
.answer{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
input[type=text]{flex:1 1 220px;font-family:var(--mono);font-size:19px;padding:12px 14px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:var(--radius)}
input[type=text]:focus{outline:2px solid var(--lupine);outline-offset:-1px;border-color:var(--lupine)}
button.go,label.go{font-family:var(--body);font-weight:700;font-size:15px;background:var(--ink);color:var(--sheet);border:1px solid var(--ink);padding:12px 22px;cursor:pointer;border-radius:var(--radius)}
button.go:hover,label.go:hover{background:var(--lupine);border-color:var(--lupine);color:var(--on-accent)}
button.go:focus-visible,button.ghost:focus-visible{outline:2px solid var(--lupine);outline-offset:2px}
button.ghost,label.ghost{font-family:var(--body);font-size:14px;background:var(--sheet);border:1px solid var(--line);padding:11px 16px;cursor:pointer;color:var(--ink);border-radius:var(--radius)}
button.ghost:hover,label.ghost:hover{border-color:var(--ink)}
.keys{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.keys[hidden]{display:none}
.keys button{font-family:var(--mono);font-size:14px;width:32px;height:30px;cursor:pointer;background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.keys button:hover{background:var(--lupine-soft);border-color:var(--lupine)}
textarea{width:100%;font-family:var(--body);font-size:16px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--sheet);resize:vertical}
textarea:focus{outline:2px solid var(--lupine);outline-offset:-1px}

/* ---------- multiple choice (greining) ---------- */
.qrow{margin-top:16px}
.qrow>label{display:block;font-size:13px;color:var(--slate);margin-bottom:5px}
.opts{display:flex;gap:5px;flex-wrap:wrap}
/* item 43: the line between the two halves of a pair */
hr.pairrule{border:0;border-top:1px dashed var(--line);margin:18px 0 14px}
.opts button{font-family:var(--body);font-size:14px;padding:8px 13px;background:var(--sheet);border:1px solid var(--line);border-radius:99px;cursor:pointer;color:var(--ink)}
.opts button:hover{border-color:var(--lupine)}
.opts button[aria-pressed="true"]{background:var(--lupine);border-color:var(--lupine);color:var(--on-accent);font-weight:600}
.opts button.right{background:var(--moss-soft);border-color:var(--moss);color:var(--moss);font-weight:600}
.opts button.wrongpick{background:var(--rust-soft);border-color:var(--rust);color:var(--rust);text-decoration:line-through}
.opts button:disabled{cursor:default}
/* Greindu orðið (v6.13, atriði 1 og 49): ein röð í einu; svaraðar raðir
   verða ein lína sem opnast aftur við smell. */
.parserows .qrow{margin-top:12px}
.qsum{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;width:100%;margin-top:6px;padding:6px 10px;
  border:1px solid var(--line);border-radius:10px;background:var(--sheet);font:inherit;color:var(--ink);text-align:left}
button.qsum{cursor:pointer}
button.qsum:hover{border-color:var(--lupine)}
.qsum .qlab{font-size:13px;color:var(--slate);min-width:88px}
.qsum .qedit{margin-left:auto;font-size:12px;color:var(--lupine)}
.qpick{display:inline-block;font-size:14px;padding:3px 11px;border:1px solid var(--line);border-radius:99px;background:var(--paper)}
.qpick.right{background:var(--moss-soft);border-color:var(--moss);color:var(--moss);font-weight:600}
.qpick.wrongpick{background:var(--rust-soft);border-color:var(--rust);color:var(--rust);text-decoration:line-through}
.qsum.no{border-color:var(--rust)}
.qstep{font-size:12px;color:var(--slate);margin-left:4px}
.qnote{margin:6px 0 0;font-size:14px}

/* ---------- verdict ---------- */
.verdict{margin-top:18px;padding:15px 17px;border-left:5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:2px}
.verdict.bad{border-left-color:var(--rust);background:var(--rust-soft)}
.verdict.good{border-left-color:var(--moss);background:var(--moss-soft)}
.verdict.ok{border-left-color:var(--moss);background:var(--moss-soft)}
.verdict.no{border-left-color:var(--rust);background:var(--rust-soft)}
.verdict.neutral{border-left-color:var(--lupine);background:var(--lupine-soft)}
/* Accepted, with something to mind: a spelling slip or the wrong row of the
   instructions. Yellow rather than green or red, because the answer counted —
   see core/leniency.js. `--sulphur` is the colour the program already uses for
   "look here", on the highlighted word in an analysis question. */
.verdict.near{border-left-color:var(--sulphur);background:var(--sulphur-soft)}
.verdict.near .xpop{color:var(--sulphur)}
.verdict h3{margin:0 0 6px;font-family:var(--display);font-size:19px;font-weight:600}
/* The mark a teacher leaves in the margin: a tick or a cross in a ring drawn
   by hand, which is why the ring is not quite round. */
.verdict.ok h3::before,.verdict.no h3::before,.verdict.near h3::before{
  display:inline-block;width:26px;height:26px;line-height:22px;text-align:center;margin-right:9px;
  font-family:var(--body);font-size:15px;font-weight:700;vertical-align:1px;
  border:2px solid currentColor;border-radius:52% 46% 50% 48%/47% 52% 46% 51%;transform:rotate(-6deg)}
.verdict.ok h3::before{content:"✓";color:var(--moss)}
.verdict.no h3::before{content:"✗";color:var(--rust)}
.verdict.near h3::before{content:"~";color:var(--sulphur)}
.verdict p{margin:0 0 4px;font-size:14px}
.forms{font-family:var(--mono);font-weight:600}
.xpop{font-family:var(--mono);font-weight:600;color:var(--lupine);float:right}
.streakline{font-size:12px;color:var(--slate);margin-top:8px}
.why{margin-top:10px;padding:9px 12px;background:var(--sheet);border:1px dashed var(--line);font-size:13px}
/* The label is the box's first <b>; bold inside the text stays inline (v6.10). */
.why > b:first-child{font-family:var(--body);font-size:11.5px;color:var(--slate);display:block;margin-bottom:2px}
.mapline{display:none}
/* Item 42: the second try, then the pupil's form and the right one side by
   side — in two boxes, and on the noun's filled-in beygingarkort. */
.verdict.retry h3::before{content:"↻"}
.compare{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.compare .cmp{flex:1 1 140px;padding:8px 10px;background:var(--sheet);border:1px solid var(--line);border-left-width:4px}
.compare .cmp.yours{border-left-color:var(--rust)}
.compare .cmp.right{border-left-color:var(--moss)}
.compare .cmplab{display:block;font-size:11.5px;color:var(--slate)}
.compare .forms{display:block;font-size:17px}
.compare small{display:block;font-size:12px;color:var(--slate);margin-bottom:4px}
.mapwrap{overflow-x:auto}
.map.filled td{width:auto;height:auto;padding:2px 5px;white-space:nowrap;animation:none;color:var(--ink)}
.map.filled td.on,.map .key.on{background:var(--moss-soft);border:2px solid var(--moss);font-weight:700;animation:none}
.map.filled td.yours,.map .key.yours{background:var(--rust-soft);border:2px solid var(--rust);font-weight:700}
.map .key{display:inline-block;padding:0 5px;margin-right:6px}

/* ---------- tables ---------- */
table.decl{border-collapse:collapse;width:100%;margin-top:8px;font-family:var(--mono);font-size:14px}
table.decl th{font-family:var(--body);font-size:11.5px;color:var(--slate);font-weight:500;padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
table.decl th.rowh{width:130px}
table.decl input.given{background:var(--sheet);color:var(--slate);border-style:dashed}
table.decl th.rowh span{font-weight:400;text-transform:none;letter-spacing:0;font-size:11px}
table.decl td{padding:3px;border-bottom:1px solid var(--line)}
table.decl input{width:100%;font-family:var(--mono);font-size:15px;padding:8px;border:1px solid transparent;background:var(--sheet);border-radius:var(--radius)}
table.decl input:focus{outline:2px solid var(--lupine);outline-offset:-2px}
table.decl input.ok{background:var(--moss-soft);color:var(--moss);font-weight:600}
table.decl input.no{background:var(--rust-soft);color:var(--rust);text-decoration:line-through}
.fix{font-family:var(--mono);font-size:12px;color:var(--moss);display:block;padding:2px 8px 4px}
.cellrow{display:flex;align-items:center;gap:8px}
.cellrow input{flex:1 1 auto;min-width:0}
.helpernoun{font-family:var(--mono);font-size:14px;color:var(--slate);white-space:nowrap;flex:none;padding-right:6px}

/* ---------- stats ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--sheet);border:1px solid var(--line);padding:13px 15px;border-radius:var(--radius)}
.tile b{font-family:var(--mono);font-size:26px;font-weight:600;display:block;letter-spacing:-.02em}
.tile span{font-size:11.5px;color:var(--slate)}
.tile small{display:block;font-size:12px;color:var(--slate);margin-top:4px}
h2.sec{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.01em;margin:34px 0 4px}
h2.sec.first{margin-top:0}
p.sub{margin:0 0 12px;font-size:13.5px;color:var(--slate);max-width:74ch}
.chartbox{background:var(--sheet);border:1px solid var(--line);padding:16px 12px 8px;border-radius:var(--radius)}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:11px;color:var(--slate);padding:6px 4px 0;flex-wrap:wrap}
.swatch{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
table.heat{border-collapse:collapse;font-family:var(--mono);font-size:11px}
table.heat th{font-family:var(--body);font-size:11.5px;color:var(--slate);font-weight:500;padding:4px 8px}
table.heat th.row{text-align:right}
table.heat td{width:74px;height:38px;border:1px solid var(--line);text-align:center}

/* ---------- badges ---------- */
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
/* --rar / --rar-ink / --rar-wash are written onto each tile by ui/panels.js
   from the badge's rarity tier, so the colour of a badge IS its category. The
   fallbacks keep an un-tiered tile looking exactly as it did before v5.6. */
.badge{--rar:var(--line);--rar-ink:#fff;--rar-wash:var(--paper-2);
  background:var(--paper-2);border:1px solid var(--line);padding:14px 10px;text-align:center;border-radius:var(--radius)}
.badge .ico{font-size:30px;line-height:1.2}
.badge .nm{font-family:var(--display);font-weight:600;font-size:13px;margin-top:4px}
.badge .ds{font-size:11px;color:var(--slate);margin-top:3px;line-height:1.35}
.badge .dt{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-top:6px}
.badge.locked{background:var(--sheet);border-style:dashed;border-color:var(--rar);color:var(--line)}
.badge.locked .ico{opacity:.28;filter:grayscale(1)}
.badge.locked .nm{color:var(--slate);font-family:var(--mono);font-weight:400}
.badge.earned{border-color:var(--rar);background:var(--rar-wash);
  box-shadow:inset 0 3px 0 0 var(--rar)}
.badge .times{display:inline-block;font-family:var(--mono);font-size:11.5px;background:var(--ink);color:var(--paper-2);border-radius:99px;padding:1px 7px;margin-top:5px}

/* ---------- modal + confetti ---------- */
/* `inset` is Safari 14.1. The long-hand beside it is understood by everything
   and costs one declaration — without it, on Safari 14.0 the scrim behind a
   badge window has no size at all: the window floats over a page that is still
   clickable, and the confetti canvas collapses to nothing. */
#confetti{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:60}
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(15,23,32,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
.modal{background:var(--sheet);border:2px solid var(--ink);border-radius:8px;max-width:380px;width:100%;padding:28px;text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal.sheetmodal{max-width:640px;text-align:left;padding:0;max-height:min(86vh,900px);display:flex;flex-direction:column;animation:none}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheethead h3{margin:0;font-size:20px}
.sheetx{background:none;border:1px solid var(--line);border-radius:99px;width:32px;height:32px;cursor:pointer;font-size:14px;color:var(--ink)}
.sheetx:hover{border-color:var(--ink)}
.sheetbody{padding:16px 20px 20px;overflow:auto}
.modal .sheetbody p{text-align:left;color:var(--ink);margin:0 0 12px}
.privacytext h1{font-family:var(--display);font-size:22px;margin:0 0 10px}
.privacytext h2{font-size:16px;margin:18px 0 6px}
.privacytext{font-size:14px;line-height:1.55}
.modal .ico{font-size:56px;line-height:1}
.modal .kicker{font-size:11.5px;color:var(--sulphur);margin-top:8px;font-weight:700}
.modal h3{font-family:var(--display);font-size:24px;margin:6px 0 4px}
.modal p{font-size:14px;color:var(--slate);margin:0 0 18px}
/* The line a deferred badge carries: which day it belongs to and why it arrived
   a day late. Set apart from the description so the child reads two things, not
   one long one. See `whenLine` in ui/dom.js. */
.modal .modalwhen{font-size:12.5px;line-height:1.5;border-top:1px solid var(--line);
  padding-top:11px;margin-top:-4px}
.modal .modalwhen b{color:var(--ink)}
/* The badges won at the same moment that the ceiling kept out of the queue —
   see `badgeWindows` in core/rarity.js. Quieter than the badge itself on
   purpose: it is a note, not a second celebration. */
.modal .modalalso{font-size:12.5px;line-height:1.5;border-top:1px solid var(--line);
  padding-top:11px;margin-top:-4px;color:var(--slate)}
.modal .modalalso b{color:var(--ink)}

/* ---------- words tab ---------- */
code{font-family:var(--mono);font-size:12px;background:var(--sheet);border:1px solid var(--line);padding:1px 5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--sheet);padding:3px 9px;border-radius:99px}
.chip i{font-style:normal;color:var(--slate);font-size:11.5px;margin-left:5px}
.chip.locked{opacity:.45}
.note{font-size:13px;color:var(--slate);line-height:1.6}
.danger{color:var(--rust);border-color:var(--rust)}
.pickw{cursor:pointer;border-bottom:2px dotted var(--line);padding:0 2px}
.pickw:hover{background:var(--lupine-soft)}
.pickw.sel{background:var(--lupine);color:var(--on-accent)}
.pickw.right{background:var(--moss-soft);color:var(--moss);border-bottom-color:var(--moss);font-weight:600}
.pickw.wrongpick{background:var(--rust-soft);color:var(--rust)}
/* v6.11: the new question shapes (ui/render-more.js) */
.pickw.missed{border-bottom:3px solid var(--moss);color:var(--moss)}
.cue{font-size:.8em;color:var(--slate);font-family:var(--mono)}
.choicegloss{background:var(--sulphur-soft);border-radius:6px;padding:6px 10px}
.sortrows{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.sortrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sortw{min-width:9ch;font-weight:600}
.deflist{margin:4px 0 0 18px;padding:0}
.bonus{margin-top:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--sheet)}
.bonus h4{margin:0 0 6px;font-size:15px}
.bonus p{margin:0 0 8px;font-size:14px}
.bonus textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px}
.bonus .answer{margin-top:6px}
table.decl th.rowh{width:150px;text-transform:none;letter-spacing:0;font-size:13px}
.filters{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.filters label{font-size:13px;color:var(--slate);display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.filters input{margin-top:3px}
#csv,#defs{height:120px;font-family:var(--mono);font-size:12px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--slate);max-width:92ch}
footer a{color:var(--lupine)}

/* ---------- hugtakahjálp ---------- */
.gl{border-bottom:1px dotted var(--lupine);cursor:help;color:inherit}
.gl:hover,.gl:focus{background:var(--lupine-soft);outline:none}
.tip{position:absolute;z-index:80;background:var(--paper-2);border:1px solid var(--ink);
  box-shadow:0 6px 22px rgba(15,23,32,.16);padding:14px 16px;font-size:13px;line-height:1.5;
  /* The explanation must not swallow a click meant for what is underneath it.
     A tooltip opened near the top of the page could lie over the tab bar, and
     every press on "Merkin þín" then went into the tooltip and nowhere else.
     Only the links inside it take the pointer; core/../ui/dom.js keeps the
     window open on hover by measuring where the pointer is instead of asking
     the browser whether the element is hovered. */
  pointer-events:none}
.tip a{pointer-events:auto}
.tip[hidden]{display:none}
.tip h4{font-family:var(--display);font-size:15px;margin:0 0 5px}
.tip p{margin:0 0 10px;color:var(--ink)}
.tip .tiplinks{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;
  border-top:1px solid var(--line);padding-top:8px}
.tip .tiplinks span{font-size:11px;color:var(--slate)}
.tip a{font-size:12px;color:var(--lupine);text-decoration:none;border-bottom:1px solid var(--lupine-soft)}
.tip a:hover{border-bottom-color:var(--lupine)}
.dfn{border-bottom:1px dotted var(--moss);cursor:help}
.dfn:hover,.dfn:focus{border-bottom-color:var(--moss);background:rgba(30,122,87,.10);outline:none}
/* A definition that would answer the question is shown but not openable —
   see CLASS_IS_THE_ANSWER in ui/render.js. No dotted rule and no help cursor,
   because nothing happens when you point at it, and a control that looks
   interactive and is not is worse than no control. */
.dfnlocked{border-bottom:none;cursor:default}
.defline{font-size:13px;color:var(--slate);margin-top:4px;font-style:italic;line-height:1.45}
.defline.none .dfn,.defline.none .dfnlocked{opacity:.75;font-style:normal;font-size:12px}
.defline.grammar{font-style:normal}
.defline .deflabel{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:999px;
  background:var(--paper);border:1px solid var(--line);font-size:11.5px;font-style:normal;
  color:var(--slate)}
.tip .tipex{margin:0 0 8px;font-size:12px;color:var(--slate)}
.tip .tipsrc{margin:0 0 8px;font-size:11.5px;color:var(--slate)}
.tip h4 i{font-family:var(--body);font-style:normal;font-size:11px;font-weight:400;color:var(--slate);margin-left:6px}
table.helperpara{border-collapse:collapse;margin:4px 0 8px}
table.helperpara th{text-align:left;font-family:var(--body);font-size:11.5px;color:var(--slate);font-weight:500;padding:2px 12px 2px 0}
table.helperpara td{padding:2px 0}
/* The rarity chip is filled with its tier colour, so the category is legible
   from across the room; `--rar-ink` is the text colour chosen alongside the
   fill in core/rarity.js, which is why the near-white tier stays readable. The
   dark hairline gives the light fills an edge without needing a second colour
   per tier. */
/* `width:fit-content` with `max-width:100%` keeps the pill as narrow as its text
   until the text is wider than the tile, and then lets it wrap instead of
   running out over the neighbouring badge. "Goðsagnakennt · ~0.05%" does not fit
   on one line in a 132px tile and must not pretend to. */
.rar{display:block;width:-webkit-fit-content;width:fit-content;max-width:100%;margin:5px auto 0;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;line-height:1.35;
  background:var(--rar);color:var(--rar-ink);border:1px solid rgba(15,23,32,.22);
  border-radius:2px;padding:2px 6px;text-align:center}
/* An estimate is dashed, a measurement is solid. The colour is the same,
   because the category is the same — it is the certainty that differs. */
.rar.est{border-style:dashed;opacity:.88}
.badge.locked .rar{opacity:.6}
.badge.meta{outline:1px solid rgba(217,162,27,.55);outline-offset:-3px}
.rosteruser{border:1px solid var(--line);padding:10px 12px;margin-bottom:8px;background:var(--paper-2)}
.rosterhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.chip.badgechip{cursor:help}

/* ---------- somebody else's badges, by rarity ----------------------------
   The chip carries the tier's own colour as a left bar and a wash, so a row of
   them reads as a rarity gradient from left to right without anyone having to
   read a word. An estimate is dashed here as it is everywhere else. */
.rosterchips{align-items:flex-start}
.chip.rarchip{border-color:var(--rar);background:var(--rar-wash);
  border-left:4px solid var(--rar);padding-left:8px;font-family:var(--body);font-size:12px}
.chip.rarchip.est{border-style:dashed;border-left-style:solid}

/* the badge-shaped door onto the rest */
.otherbadges{position:relative;cursor:pointer;border-style:dashed;background:var(--sheet);
  font-family:var(--body);font-size:12px;min-height:26px;display:inline-flex;
  align-items:center;gap:5px}
.otherbadges:focus-visible{outline:2px solid var(--lupine);outline-offset:2px}
.otherbadges>i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--slate);
  border-left:1px solid var(--line);padding-left:6px}
.othergrid{display:none;position:absolute;z-index:40;left:0;top:calc(100% + 6px);
  width:min(420px,86vw);background:var(--paper-2);border:1px solid var(--ink);
  box-shadow:0 6px 22px rgba(15,23,32,.16);padding:10px 12px;cursor:default}
.otherbadges:hover .othergrid,.otherbadges:focus-within .othergrid,
.otherbadges.open .othergrid{display:block}
.otherhead{display:block;font-size:11.5px;
  color:var(--slate);margin-bottom:7px}
.othergridin{display:flex;flex-wrap:wrap;gap:5px;max-height:44vh;overflow-y:auto}

/* ---------- the two ways of looking at your own badges ------------------- */
.viewpick,.boardpick{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px}
.viewpick button,.boardpick button{font-family:var(--body);font-size:13px;padding:7px 13px;
  background:var(--sheet);border:1px solid var(--line);border-radius:99px;cursor:pointer;color:var(--slate)}
.viewpick button:hover,.boardpick button:hover{border-color:var(--lupine);color:var(--ink)}
.viewpick button[aria-pressed="true"],.boardpick button[aria-pressed="true"]{
  background:var(--ink);border-color:var(--ink);color:var(--paper-2);font-weight:600}
.viewpick button:focus-visible,.boardpick button:focus-visible{
  outline:2px solid var(--lupine);outline-offset:2px}
h3.bgroup.tiergroup{border-left:4px solid var(--rar);padding-left:9px;background:var(--rar-wash);
  padding-top:5px;padding-bottom:5px}
h3.bgroup.tiergroup .tierdot{color:var(--rar);font-size:15px}
h3.bgroup.tiergroup i{margin-left:auto;padding-right:9px}
.rarmove{font-style:normal;margin-left:5px;font-weight:700}

/* ---------- the leaderboard ---------------------------------------------- */
.lsnstatus{font-size:13px;color:var(--slate);margin:22px 0 4px}
.lsnstatus .lsndone{color:var(--moss);font-weight:600}
.lsnend{height:1px}
table.board{border-collapse:collapse;width:100%;font-size:14px}
table.board td{padding:8px 10px 8px 0;border-top:1px solid var(--line)}
table.board th.right,table.board td.right{text-align:right;padding-right:0}
table.board td.mono,table.board td.place{font-family:var(--mono);font-size:13px}
table.board td.place{color:var(--slate);width:46px}
table.board tr.meRow{background:var(--lupine-soft)}
table.board tr.meRow td{font-weight:600}
table.board th.th{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--slate);
  text-align:left;padding:0 10px 8px 0;white-space:nowrap}
table.board th.right{text-align:right;padding-right:0}
table.board th.primary{color:var(--ink)}
table.board th.primary .sortmark{color:var(--lupine);font-size:11px}
table.board td.primary{font-weight:700;color:var(--ink);font-size:14px;padding-left:12px}
table.board td.sec,table.board th.sec{color:var(--slate);padding-left:14px;width:64px}
table.board tr:not(.gaprow):hover td{background:var(--paper-2)}
table.board tr.meRow:hover td{background:transparent}
table.board.boardIn{animation:boardIn .22s ease-out}
table.board.loading{opacity:.45;transition:opacity .15s}
@keyframes boardIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){table.board.boardIn{animation:none}}
.youtag{font-style:normal;font-size:11.5px;
  color:var(--lupine);border:1px solid var(--lupine);border-radius:99px;padding:1px 6px}
b.legendary,#crest.legendary,.legendary{color:#D9A21B}
#crest{font-weight:600;letter-spacing:.04em}
.faint{opacity:.7}
.licgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:6px}
.liccard{border:1px solid var(--line);padding:10px 12px;background:var(--paper-2);font-size:13px}
.lichead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
/* `white-space:nowrap` kept the licence tag on one line and pushed it off the
   right edge of a 360px screen — "CC BY-SA 4.0" is wider than the space left
   beside a long package name. It may wrap; nothing depends on it not doing. */
.licl{font-size:11.5px;color:var(--slate)}
.licwho{font-size:12px;color:var(--slate);margin-top:2px}
.licwhat{margin-top:5px;line-height:1.45}
.liccard a{font-size:11px;color:var(--lupine);word-break:break-all;text-decoration:none;display:inline-block;margin-top:5px}
.helpnote{font-size:12px;color:var(--slate);margin:8px 0 0;font-style:italic}

/* ---------- færnikortið (item 83, ui/skillmap.js) --------------------------
   The pupil's main view of where they stand, drawn on a board of its own:
   `.blackboard` turns every colour name into chalk, so the rings, the marks
   and the bars below need no second palette. Each category is a trail (a
   chalk line down the left) and each curriculum node a ring on it.

   Laid out on a grid (owner feedback, 6.13): every category is a box, the
   boxes in a row are as tall as the tallest of them (a short one keeps the
   dead space below its trail), and with subgrid the heads of a row share one
   height, so every trail in a row starts on the same line. Three abreast on
   a desk, two on a tablet, one under the other on a phone; nothing scrolls
   sideways.

   The ring is the fill level (a quarter per mastery mark), dashed when there
   are too few answers to say. Colour repeats what the shape says and is never
   the only sign: red chalk a quarter, yellow a half, green from there. */
.skillboard.blackboard{border-bottom:10px solid var(--wood);border-radius:6px;margin:6px 0 26px;padding:14px 22px 20px}
.smboardhead{align-items:baseline}
.smtitle{font-family:var(--display);font-size:20px;font-weight:600;color:var(--chalk);letter-spacing:-.01em}
.smtotals{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--chalk-dim)}
.smtotals b{font-family:var(--mono);font-weight:600;color:var(--chalk);margin-left:3px}
.smtotals .warn b{color:var(--chalk-yellow)}
.smlegendbox{margin:10px 0 0}
.smlegendbox summary{cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--chalk-dim);
  min-height:30px;list-style:none;border-bottom:1px dashed var(--line)}
.smlegendbox summary::-webkit-details-marker{display:none}
.smlegendbox summary::after{content:"▾";font-size:11px}
.smlegendbox[open] summary::after{content:"▴"}
.smlegendbox summary:focus-visible{outline:2px solid var(--chalk-yellow);outline-offset:2px}
.smlegendbox summary .smlegrings{display:inline-flex;gap:3px}
.smlegend{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:6px 24px;font-size:12.5px;line-height:1.45;color:var(--chalk-dim)}
.smlegend li{display:flex;align-items:flex-start;gap:9px}
.smlegend li>span:first-child{flex:none;min-width:22px;display:inline-flex;justify-content:center;padding-top:1px}
.smlegend b{color:var(--chalk);font-weight:600}
.smlegend .smlegmarks{grid-column:1/-1}
.smlegrings{gap:3px}
.smlegword{font-size:11.5px;color:var(--chalk);border-bottom:1px dashed var(--line);white-space:nowrap}
.smnext{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 0;padding:10px 12px;
  border:1px dashed rgba(242,217,107,.55);border-radius:var(--radius);background:var(--sulphur-soft)}
.smnextlbl{font-family:var(--display);font-size:14px;font-weight:600;color:var(--chalk-yellow);margin-right:2px}
.smnextbtn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;color:var(--chalk);cursor:pointer;
  background:rgba(23,42,34,.55);border:1px solid var(--line);border-radius:99px;padding:5px 8px 5px 7px;min-height:34px;text-align:left}
.smnextbtn:hover{border-color:var(--chalk-yellow)}
.smlanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:18px;margin-top:20px;align-items:stretch}
.smlane{display:flex;flex-direction:column;margin:0;padding:12px 12px 10px;min-width:0;
  border:1px solid rgba(243,241,231,.22);border-radius:var(--radius)}
@supports (grid-template-rows:subgrid){
  .smlanes{grid-auto-rows:auto auto}
  .smlane{display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:0;align-content:start}
  .smlane>.smtrail{align-self:start}
}
.smhead{padding-bottom:7px;border-bottom:1px dashed var(--line)}
.smhead h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 7px;margin:0;font-family:var(--display);font-size:16.5px;font-weight:600;
  color:var(--chalk);line-height:1.25}
/* A long category name (Orðflokkagreining) stays inside its box: the chips
   after it wrap to the next line, and a name wider than the box itself breaks. */
.smname{margin-right:auto;min-width:0;overflow-wrap:anywhere;hyphens:auto}
.smstig{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--chalk-yellow);white-space:nowrap}
.smoff{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--chalk-dim);border:1px dashed var(--line);padding:0 5px;white-space:nowrap}
.skico{font-size:16px}
.skbar{height:3px;background:var(--line);margin:7px 0 5px}
.skbar i{display:block;height:3px;background:var(--lupine)}
.smmeta{margin:0;font-size:11.5px;line-height:1.45;color:var(--chalk-dim)}
.smmark{margin:4px 0 0;font-size:11.5px;line-height:1.5;color:var(--chalk-dim);display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px}
.smmark .mastery{margin-left:0}
.tagstrong{font-style:normal;font-size:11px;padding:1px 6px;background:var(--moss-soft);color:var(--moss)}
.smlane.off .smhead h3,.smlane.off .smmeta,.smlane.off .smmark{color:var(--chalk-dim)}

/* the trail: a chalk line through the middle of the rings */
.smtrail{list-style:none;margin:6px 0 0;padding:0;position:relative}
.smtrail::before{content:"";position:absolute;left:21px;top:14px;bottom:24px;border-left:2px dotted rgba(243,241,231,.34)}
.smtrail li{position:relative}
.smyear{padding:7px 0 1px 46px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-dim)}
.smyear span{background:var(--board);padding:0 6px 0 0}
.smyear::before{content:"";position:absolute;left:17px;top:14px;width:10px;border-top:2px solid rgba(243,241,231,.5)}
.smnode{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin:0;padding:5px 8px 5px 5px;text-align:left;
  font:inherit;color:var(--chalk);background:none;border:1px solid transparent;border-radius:var(--radius);cursor:pointer}
.smnode:hover{background:rgba(243,241,231,.07);border-color:var(--line)}
.smnode:focus-visible,.smnextbtn:focus-visible{outline:2px solid var(--chalk-yellow);outline-offset:1px}
.smglyph{flex:none;width:34px;height:34px;border-radius:50%;background:var(--board);display:flex;align-items:center;justify-content:center}
.smtext{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.smtext b{font-weight:600;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.smtext small{font-size:11.5px;line-height:1.35;color:var(--chalk-dim)}
.smnode.m1 .smtext small{color:var(--rust)} .smnode.m2 .smtext small{color:var(--chalk-yellow)}
.smnode.m3 .smtext small,.smnode.m4 .smtext small{color:var(--moss)}
.smnode .smlast{color:var(--chalk-dim)}
.smnode.locked{cursor:pointer}
.smnode.locked .smtext b{font-weight:500;color:var(--chalk-dim)}
/* Switched off in the pupil's material: still readable (5:1 on the board,
   tests/skillmap.test.js), plainly quieter. */
.smnode.off .smtext b{font-weight:500;color:var(--chalk-dim)}
.smnode.off .smtext small{color:var(--chalk-dim)}
.smnode.off .smring{opacity:.75}

svg.smring{flex:none;width:32px;height:32px;display:block;overflow:visible}
.smring .rim{stroke:var(--chalk);stroke-width:2.2;stroke-linecap:round}
.smring .fill{fill:var(--chalk);stroke:none}
.smring.r0 .rim{stroke:var(--chalk-dim);stroke-dasharray:3.4 3.5}
.smring.r1 .rim,.smring.r1 .fill{stroke:var(--rust)} .smring.r1 .fill{fill:var(--rust)}
.smring.r2 .rim,.smring.r2 .fill{stroke:var(--chalk-yellow)} .smring.r2 .fill{fill:var(--chalk-yellow)}
.smring.r3 .rim,.smring.r4 .rim{stroke:var(--moss)} .smring.r3 .fill,.smring.r4 .fill{fill:var(--moss)}
.smring .tick{stroke:var(--board-deep);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.smring.locked path{stroke:var(--chalk-dim);stroke-width:2;stroke-linecap:round}
.smring.locked rect{fill:none;stroke:var(--chalk-dim);stroke-width:2}
/* Owner feedback 6.14: the step a ring measures, in it, and a rise played
   (ui/skillmap.js playRises). The number keeps a halo of the board so it
   reads over any part of the wedge; on a full disc it is dark. */
.smring .num{font-family:var(--mono);font-size:12.5px;font-weight:700;fill:var(--chalk);
  paint-order:stroke;stroke:var(--board);stroke-width:3px;stroke-linejoin:round}
.smring.r4 .num{fill:var(--board-deep);stroke:none}
.smband{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--chalk-dim);white-space:nowrap;
  padding:0 5px;border:1px solid transparent;border-radius:3px}
.smband b{color:var(--chalk);font-weight:700}
.smband.up{background:var(--chalk-yellow);color:var(--board-deep)}
.smband.up b{color:var(--board-deep)}

/* ---------- the curriculum policy editor (v5.8) ----------
   One widget, two users: the child in Framvinda and the administrator in Gögn.
   A switch the administrator has turned off is shown DISABLED rather than
   hidden — a child should be able to see that þágufall exists and that somebody
   else decided today is not the day for it. Hiding it would look like a bug. */
.polsw{display:flex;gap:9px;align-items:flex-start;background:var(--paper-2);
  border:1px solid var(--line);padding:10px 12px;cursor:pointer;border-radius:var(--radius);

.polsw.capped{opacity:.55;cursor:not-allowed;background:var(--paper)}
.polsw.capped:hover{border-color:var(--line)}

  border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;color:var(--ink)}

.chip.word.good{border-color:var(--moss);color:var(--moss)}

/* Word rarity (v5.6): the tier colour rides on the chip as a small lozenge,
   and only from "Sjaldgæft" upwards. Common and uncommon words carry no mark at
   all — a grey diamond beside every one of six thousand words is not
   information, it is wallpaper. The chip's own border still shows how well the
   child knows the word; the two never share a colour channel. */
.chip.word.rar-sjaldgaeft::after,.chip.word.rar-mjogsjaldgaeft::after,
.chip.word.rar-sogulegt::after,.chip.word.rar-godsagnakennt::after{
  content:"";display:inline-block;width:7px;height:7px;margin-left:6px;
  background:var(--rar);vertical-align:middle;transform:rotate(45deg)}
.chip.word.rare{box-shadow:inset 0 0 0 2px var(--rar-wash)}

/* ---------- names, titles and shelves (v6.1) -----------------------------
   One name looks the same wherever it appears (ui/panels.js `whoHTML`). The
   frame is the level band — earned by the best level ever reached and never
   taken back — and it is a rule under the name rather than a colour OF the
   name, because the gold of "Öll merkin" already owns the text colour. */
.who{font-weight:700;padding:1px 0 1px;border-bottom:3px solid var(--band,transparent)}
.who.b1{--band:transparent}
.who.b2{--band:#A9713A}
.who.b3{--band:#8C9AA6}

.who.b5{--band:var(--ink);background:var(--ink);color:var(--paper-2);padding:1px 7px;border-radius:2px}
.who.b6{--band:transparent;padding:1px 7px;border-radius:2px;color:#fff;
  background:linear-gradient(100deg,#1E7A57,#2E6FBF 55%,#7A3FBF)}
.who.b5.legendary,.who.b6.legendary{color:#F3C54B}
.whotitle{font-size:11px;color:var(--slate);letter-spacing:.04em;margin-left:7px;white-space:nowrap}

.mycard{background:var(--sheet);border:1px solid var(--ink);border-radius:10px;overflow:hidden;padding:0 0 12px}
.mycard>:not(.mystrip){margin-left:18px;margin-right:18px}

  background:var(--ink);color:#fff;padding:8px 18px;border-bottom:5px solid var(--band,var(--slate))}

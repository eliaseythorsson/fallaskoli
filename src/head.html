.mystrip span{font-size:12px;opacity:.8}
.mycard.b2{--band:#A9713A}.mycard.b3{--band:#8C9AA6}.mycard.b4{--band:var(--sulphur)}
.mycard.b5{--band:var(--ink)}.mycard.b6{--band:#7A3FBF}
.myhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.myname{font-family:var(--display);font-size:20px}
.myname .whotitle{font-family:var(--body);font-size:12px}
.mymeta{font-family:var(--mono);font-size:11px;color:var(--slate)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 12px}
.slot{border:1px dashed var(--line);background:var(--sheet);padding:12px 8px;text-align:center;border-radius:var(--radius);min-width:0}
.slot.filled{border-style:solid;border-color:var(--lupine);background:var(--lupine-soft)}
.slot .ico{display:block;font-size:28px;line-height:1.2}
.slot:not(.filled) .ico{color:var(--line)}
.slot .nm{display:block;font-family:var(--display);font-size:12px;font-weight:600;margin-top:3px;
  overflow-wrap:anywhere}
.slot:not(.filled) .nm{font-family:var(--mono);font-weight:400;color:var(--slate)}
.myrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.myrow label{font-size:11.5px;color:var(--slate)}
.myrow .sub{margin:0;flex:1 1 220px;font-size:13px;color:var(--slate)}
.feed .sub{font-size:13px;color:var(--slate)}

/* the pin on a badge you own, and the medal on one you keep winning */
.badge .pin{position:absolute;top:4px;right:4px;width:26px;height:26px;padding:0;border:1px solid transparent;
  background:none;border-radius:99px;cursor:pointer;font-size:13px;line-height:1;opacity:.28;filter:grayscale(1)}
.badge .pin:hover,.badge .pin:focus-visible{opacity:.8;border-color:var(--line);background:var(--sheet);outline:none}
.badge .pin[aria-pressed="true"]{opacity:1;filter:none;background:var(--sheet);border-color:var(--lupine)}
.badge .pin.full{border-color:var(--rust);opacity:1}
.badge .times.medal{background:var(--sheet);color:var(--ink);border:1px solid var(--ink)}
.badge .times.medal.m1{border-color:#A9713A}
.badge .times.medal.m2{border-color:#8C9AA6}
.badge .times.medal.m3{border-color:var(--sulphur);background:var(--sulphur-soft)}

/* a rumour: somebody has it, you do not know how */
.chip.rarchip.rumour{border-style:dotted;border-left-style:solid}
.q{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--lupine);font-weight:600}
.firstmark{font-style:normal;color:var(--sulphur);font-size:11px;font-weight:700}
.medalmark{font-style:normal;font-size:11px}
.rumourcount{color:var(--lupine);font-weight:600}
.rosteruser.me{border-color:var(--lupine)}
.rosterwho{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:0 2px;min-width:0}
.cmpbtn{margin-top:9px;padding:6px 11px;font-size:12px}
.cmp{margin-top:10px}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cmpcol{background:var(--sheet);border:1px solid var(--line);padding:9px 11px;min-width:0}
.cmpcol:first-child{border-color:var(--lupine)}
.cmpcol h4{font-family:var(--display);font-size:13px;margin:0 0 2px;display:flex;justify-content:space-between;gap:8px}
.cmpcol h4 i{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--slate)}
.cmpcol .chips{margin-top:7px}

.feed{background:var(--lupine-soft);border:1px solid var(--lupine);padding:10px 13px;margin-bottom:10px;font-size:13px}
.feed.empty{background:var(--paper-2);border-color:var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.feed.empty .sub{margin:0}
.feed>b{font-family:var(--display);font-size:14px}
.feed ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:3px 16px}
.feed li.mine{color:var(--slate)}
.feedwho{font-weight:700}
.feedbadge{white-space:nowrap}
.feedbadge.rumour{border-bottom:2px dotted var(--lupine)}

.weekline{font-size:13px;margin:0 0 10px;padding:8px 11px;background:var(--paper-2);border-left:3px solid var(--lupine)}
.weekline .champ{white-space:nowrap}
table.board tr.gaprow td{font-family:var(--mono);font-size:11px;color:var(--slate);text-align:center;
  padding:4px 0;border-top:1px dashed var(--line)}
#boardall{margin-top:10px;padding:7px 12px;font-size:12px}
table.board td.mono{white-space:nowrap}


/* ================= taflan (v6.2) =========================================
   The Æfa tab is a school board: green, framed in birch, with a ledge for the
   chalk. Everything `ui/render.js` draws into `#task` lands on it.

   The colour names are re-declared here as chalk — see the note at the top of
   this sheet. Soft colours become thin washes of the same chalk, so a right
   answer in a table is a green smudge and not a white box. */
.blackboard{
  --ink:var(--chalk); --slate:var(--chalk-dim); --line:rgba(243,241,231,.30);
  --paper:rgba(243,241,231,.06); --paper-2:rgba(243,241,231,.05); --sheet:rgba(243,241,231,.08);
  --lupine:var(--chalk-yellow); --lupine-soft:rgba(242,217,107,.16);
  --moss:#93E0B4; --moss-soft:rgba(147,224,180,.16);
  --rust:#FFA193; --rust-soft:rgba(255,161,147,.17);
  --sulphur:var(--chalk-yellow); --sulphur-soft:rgba(242,217,107,.18);
  --on-accent:var(--board-deep);
  position:relative;color:var(--chalk);
  background-color:var(--board);
  /* where the sponge has been: two pale smears and a slant of light */
  background-image:radial-gradient(ellipse 60% 40% at 18% 12%,rgba(255,255,255,.055),transparent 70%),
    radial-gradient(ellipse 50% 45% at 88% 86%,rgba(255,255,255,.04),transparent 70%),
    linear-gradient(172deg,rgba(255,255,255,.03),transparent 45%);
  border:10px solid var(--wood);border-bottom:none;border-radius:6px 6px 0 0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 3px 14px rgba(0,0,0,.28);
  padding:16px 26px 26px;margin-bottom:38px}
.boardhead{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:1px dashed var(--line);font-size:13px;color:var(--chalk-dim)}
#boarddate{font-family:var(--display);font-size:16px;font-weight:600;color:var(--chalk)}
#boarddate i{font-style:normal;font-weight:400;color:var(--chalk-dim);margin-left:10px}
.tally{display:inline-flex;align-items:center;gap:10px}
.tallymarks{display:inline-flex;gap:7px;flex-wrap:wrap}
.tallymarks svg{width:21px;height:20px;display:block}
.tallymarks line{stroke:var(--chalk);stroke-width:1.7;stroke-linecap:round}
.tallymarks line.todo{stroke:rgba(243,241,231,.2)}
.tallymarks.met line{stroke:var(--chalk-yellow)}

/* the ledge, the chalk and the sponge */
.tray{position:absolute;left:-10px;right:-10px;top:100%;height:16px;border-radius:0 0 4px 4px;
  background:linear-gradient(var(--wood) 0,var(--wood) 5px,var(--wood-deep) 5px);
  box-shadow:0 8px 14px rgba(18,25,34,.22)}
.tray i{position:absolute;bottom:11px;display:block}
.tray .chalk{left:34px;width:38px;height:7px;border-radius:2px;background:var(--chalk);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.tray .chalk.y{left:84px;width:24px;background:var(--chalk-yellow);transform:rotate(-3deg)}
.tray .sponge{right:38px;width:52px;height:13px;border-radius:2px;
  background:linear-gradient(#8B6B43 0,#8B6B43 5px,#30363B 5px)}

.blackboard textarea{color:var(--ink)}
/* Item 51, measured (tests/contrast.test.js): chalk-dim on the board is 6.1:1
   (5.2:1 on the lightest smear), so the gloss and every other grey line is
   fine. Two things on the board fell below 4.5:1 and are raised: `.faint`
   (opacity .7 gave 3.8:1) and the placeholder (alpha .45 gave 3.5:1). */
.blackboard .faint{opacity:.92}
.blackboard input::placeholder,.blackboard textarea::placeholder{color:rgba(243,241,231,.7)}
.blackboard table.decl input{border:1px solid rgba(243,241,231,.16)}
.blackboard input:disabled,.blackboard textarea:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.blackboard button.go,.blackboard label.go{background:var(--chalk);border-color:var(--chalk);color:var(--board-deep)}
.blackboard button.go:hover,.blackboard label.go:hover{background:var(--chalk-yellow);border-color:var(--chalk-yellow);color:var(--board-deep)}
.blackboard button.go:disabled{opacity:.6;cursor:default}
.blackboard button.ghost{background:none;color:var(--chalk)}
.blackboard button.ghost:hover{border-color:var(--chalk)}
.blackboard button.ghost:disabled{opacity:.45;cursor:default}
.blackboard .opts button,.blackboard .keys button{color:var(--chalk)}
.blackboard .opts button:hover,.blackboard .keys button:hover{border-color:var(--chalk-yellow)}
.blackboard .loginbox input{background:var(--sheet);border-radius:var(--radius)}
.blackboard .helpnote a{color:var(--chalk-yellow)}
/* a note on paper, held to the board */
.blackboard .verdict{box-shadow:0 8px 20px rgba(0,0,0,.3)}
.blackboard .verdict.neutral{background:var(--sheet)}
.blackboard .verdict .why{background:var(--paper-2)}

/* ================= merki og framvinda =================================== */
/* A rarity wash is a transparent tint, and the desk behind it is squared
   paper. Each tinted thing gets the sheet underneath, or the squares show
   through the badge. */
.badge.earned,.badge.locked,.badge.mystery,h3.bgroup.tiergroup,.chip.rarchip,.slot,.cmpcol{
  background-image:linear-gradient(var(--rar-wash,transparent),var(--rar-wash,transparent));
  background-color:var(--sheet)}
.badge{border-radius:6px}
.defline .lookup{margin-left:10px}
.overview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:26px}
.overview .grid2{grid-template-columns:1fr 1fr;gap:10px;margin:0}
.overview .tile b{font-size:23px}
/* Merki / Framvinda / Orðasafn: a line of words with the open one run over in
   highlighter. Deliberately not a second row of binder dividers. */
.panepick{display:flex;gap:6px 26px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 22px}
.panepick button{font-family:var(--display);font-size:18px;font-weight:600;background:none;border:none;
  color:var(--slate);cursor:pointer;padding:8px 2px 9px;margin-bottom:-1px;border-bottom:1px solid transparent}
.panepick button:hover{color:var(--ink)}
.panepick button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);
  background:linear-gradient(transparent 52%,var(--marker) 52%,var(--marker) 86%,transparent 86%)}
.panepick button:focus-visible{outline:2px solid var(--lupine);outline-offset:2px}

/* ================= skólastofan ========================================== */
#board{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.emptyroom b{font-family:var(--display);font-size:18px;font-weight:600}
.emptyroom .sub{margin:4px 0 0}
#roster>.emptyroom{background:var(--sheet);border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px}

/* ================= stillingar og námsefni =============================== */
.setrow>label{display:block;font-size:14px;font-weight:600}
.setrow .answer{margin-top:6px}
.filters label{font-size:14px;color:var(--ink)}
/* What the Gögn tab used to hold. Folded, at the very bottom. */
details.about{margin-top:44px;border-top:1px solid var(--line)}
details.about>summary{cursor:pointer;font-size:14px;color:var(--slate);padding:14px 0;min-height:44px}
details.about>summary:hover{color:var(--ink)}
details.about>summary:focus-visible{outline:2px solid var(--lupine);outline-offset:2px}
details.about[open]>summary{color:var(--ink);font-weight:600;margin-bottom:10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= sími og spjaldtölva =================================
   Skráin er opnuð með tvísmelli á tölvu í dag, en sama skrá á að vera nothæf
   í símanum þegar hún kemur á vefþjón. Þrennt skiptir mestu: ekkert má fara
   út fyrir skjábreiddina, allt sem er ýtt á þarf að vera minnst 44px, og
   innsláttarsvið verða að vera 16px eða stærri — annars þysjar iOS inn í hvert
   sinn sem barnið byrjar að skrifa.                                       */

/* ================= fingur, ekki mús =====================================
   Þangað til í v5.7 réðst stærð á því sem ýtt er á af BREIDD skjásins: reglurnar
   fyrir 44px þumalfleti stóðu allar inni í `max-width:600px`. iPad er 744–1080
   px breiður, svo hann fékk enga þeirra — flipar voru 33px, íslensku stafirnir
   30px og hnapparnir í nýju valröðunum 31px, allt á tæki sem er eingöngu snert.
   Breidd segir ekkert um hvort bendill er fingur eða mús; `pointer: coarse`
   segir það. Reglurnar hér gilda því á spjaldtölvu, síma og snertiskjá á
   fartölvu, og breyta engu fyrir mús.                                       */
@media (pointer:coarse){
  nav.tabs button{min-height:44px}
  button.go,button.ghost,.opts button,.viewpick button,.boardpick button,
  .adminacts button,.keys button,.otherbadges{min-height:44px}
  .cmpbtn,#boardall,#titlepick,.panepick button,label.ghost,label.go{min-height:44px}
  .badge .pin{width:40px;height:40px;font-size:16px;opacity:.45}
  .keys button{min-width:42px;font-size:17px}
  .opts button{padding:10px 14px}
  input[type=text],textarea,.loginbox input{min-height:44px;font-size:16px}
  table.decl input{min-height:44px;font-size:16px}
  .filters input[type=checkbox],.curline input[type=checkbox]{width:20px;height:20px}
  /* Hover does not exist here, so the definition drawer in "Merki annarra" is
     opened by a tap instead — ui/panels.js adds .open. The wider target above
     is what makes that tap land. */
  .otherbadges{padding-top:8px;padding-bottom:8px}
  /* v6.7 */
  .lessonlink{display:inline-flex;align-items:center;min-height:40px;padding:0 4px}
  .lsnitem{min-height:44px;align-items:center}
  .duelsize button,.duelform select,button.go.small{min-height:44px}
  .lsncheck summary{min-height:40px;display:flex;align-items:center}
}

@media (max-width:820px){
  .wrap{padding:0 14px 96px}
  .chartbox{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  .chartbox svg{min-width:520px;display:block}
}

@media (max-width:600px){
  html{-webkit-text-size-adjust:100%}
  .wrap{padding:0 12px 110px}

  /* hausinn: nafn í línu, tölur í eigin röð sem má skruna */
  .topbar{gap:10px;padding:14px 0 10px}
  .brand{flex:1 1 100%;margin-right:0}
  .brand h1{font-size:26px}
  .brand p{font-size:12px}
  .stats{flex:1 1 100%;gap:4px;flex-wrap:nowrap}
  .stat{flex:1 1 0;text-align:center;min-width:0;padding:5px 2px 4px}
  .stat b{font-size:16px}
  .stat span{font-size:11px;display:block;line-height:1.15}
  .levelmeta{font-size:11.5px}

  /* flipar: allir fjórir sjást alltaf. Löngu nöfnin brotna í tvær línur í
     stað þess að ýta síðasta flipanum út af skjánum — flipi sem þarf að skruna
     að er flipi sem enginn finnur. */
  nav.tabs{gap:3px;margin:14px 0 16px}
  nav.tabs button{flex:1 1 auto;min-width:0;min-height:48px;padding:6px 5px 7px;font-size:12.5px;
    border-top-width:4px}

  .sentence{font-size:21px;line-height:1.45}
  .prompt-row{gap:14px;margin-top:14px;padding-top:14px}
  .map{display:none}                 /* beygingarkortið er of breitt */
  .mapline{display:block;flex:1 1 100%;margin:0;font-size:14px;color:var(--slate)}  /* …svo það sem það segir stendur í texta */
  .map.filled{display:table;font-size:11px}  /* item 42: the filled-in one, under the answer, scrolls in its own box */
  .map.filled td{padding:2px 3px}
  .mapline b{color:var(--ink,inherit)}

  /* svarsvæði: fullbreiður innsláttur, hnappar undir og þumalvænir */
  .answer{flex-wrap:wrap;gap:8px}
  .answer input[type=text]{flex:1 1 100%;font-size:16px;min-height:46px}
  .answer button,.go,.ghost{min-height:46px;flex:1 1 auto}
  textarea{font-size:16px}

  /* fjölvalshnappar: nógu stórir fyrir fingur, ekki þéttir */
  .opts{gap:6px}
  .opts button{min-height:44px;padding:9px 12px;font-size:14px}
  .qrow{margin-bottom:12px}
  .qrow label{font-size:11px}

  /* íslensku stafirnir: undir svarreitnum, í flæðinu. Fram að v6.13 voru
     þeir límdir við neðri kantinn (sticky) og lágu þá ofan á svarreitnum og
     fyrstu línu taflna (atriði 2, 53). */
  .keys{margin-top:10px}
  .keys button{min-width:40px;min-height:44px;font-size:17px}

  /* töflur */
  table.decl th.rowh{width:auto;font-size:12px}
  table.decl input{font-size:16px;min-height:44px}
  .heat{font-size:11.5px}
  .heat th.row{font-size:11px;white-space:nowrap}

  /* merki: tvær súlur í stað fjögurra */
  .badgegrid.inner{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
  .badge{padding:10px 8px}
  .badge .nm{font-size:12px}
  .badge .ds{font-size:11.5px}
  .bdate{font-size:11px}


  .blackboard{border-width:7px;padding:12px 14px 18px;margin-bottom:32px}
  .tray{left:-7px;right:-7px}
  #boarddate{font-size:14px}
  .overview{grid-template-columns:1fr}
  .overview .grid2{grid-template-columns:1fr 1fr!important}
  .overview .tile{padding:10px 12px}
  .panepick{gap:4px 20px}
  .panepick button{font-size:17px}
  #board{padding:10px 10px}
  .tip{font-size:14px;max-width:calc(100vw - 24px)}
  .chips{gap:5px}
  .grid2{grid-template-columns:1fr!important}
  footer{font-size:11.5px}
}

@media (max-width:380px){
  .sentence{font-size:18px}
  .badgegrid.inner{grid-template-columns:1fr!important}
}

/* ---------- accounts, consent and the admin page (v6.3) ------------------ */
.loginbox input[type=checkbox],.loginbox input[type=radio]{width:auto;min-height:0;padding:0;margin:3px 8px 0 0;flex:0 0 auto}
.loginbox select,.polactions select,.morerow select{font:inherit;font-size:16px;padding:9px 10px;min-height:40px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--sheet);color:var(--ink);max-width:100%}
.loginbox select{width:100%}
.consentbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:14px 0 4px;background:var(--paper-2)}
/* block, not flex: a label holding text AND a link would have each piece laid
   out as its own column */
.consentbox label{display:block;padding-left:26px;font-size:14px;line-height:1.45;margin:6px 0;color:var(--ink)}
.consentbox label input[type=checkbox],.consentbox label input[type=radio]{float:left;margin:3px 0 0 -26px}
.consentbox label.lbl{padding-left:0}
.consentbox .sub{margin:8px 0 2px}
.sharecard{border:1px solid var(--lupine);background:var(--lupine-soft);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.sharecard>b{font-family:var(--display);font-size:17px}
.sharecard .sub{margin:4px 0 0;color:var(--ink)}
.sharecard .answer{margin-top:10px}
input.pwin{flex:1 1 220px;max-width:320px;font-family:var(--body);font-size:16px;padding:10px 12px;min-height:42px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--sheet);color:var(--ink)}
input.numin{width:60px;flex:0 0 60px;font-family:var(--mono);font-size:16px;padding:8px;min-height:40px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--sheet);color:var(--ink)}
a.ghost{text-decoration:none;display:inline-flex;align-items:center;font-family:var(--body);font-size:14px;
  background:var(--sheet);border:1px solid var(--line);padding:11px 16px;color:var(--ink);border-radius:var(--radius)}
a.ghost:hover{border-color:var(--ink)}
.adminacts a.ghost{min-height:36px;font-size:12px;padding:6px 10px}
code.secret{font-family:var(--mono);font-size:15px;font-weight:600;background:var(--sulphur-soft);padding:2px 7px;border-radius:4px;
  user-select:all;white-space:nowrap}
.pillrow{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
tr.adminmore td{background:var(--paper-2)}
.morerow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:6px 0}
.morerow>b{font-size:13px}
.moreform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 100%}
.moreform label{font-size:13px;display:flex;align-items:center;gap:6px}
.moreform input[type=text]{flex:1 1 200px;max-width:300px;font-family:var(--body);font-size:16px;padding:8px 10px}
/* Item 50: the fine switches for a teacher or parent. */
details.teacherfold{margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);padding:0 14px 8px;background:var(--paper-2)}
details.teacherfold>summary{cursor:pointer;font-weight:600;font-size:15px;padding:12px 0;min-height:44px}
details.teacherfold>summary:focus-visible{outline:2px solid var(--lupine);outline-offset:2px}
details.adminnew{margin-top:12px}
details.adminnew>summary,#ad-trail>summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0}
.groupchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;
  background:var(--sheet);font-size:13px}
.groupchip i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--slate)}
.groupchip button{min-height:28px;font-size:11px;padding:2px 8px}

/* ---- v6.6: the rescue drill strip, word health ---- */
.drillstrip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 0;padding:10px 12px;
  border:1px dashed var(--line);border-left:4px solid var(--lupine);border-radius:var(--radius);background:var(--lupine-soft)}
.drillstrip.offer{border-left-color:var(--rust);background:var(--rust-soft)}
.drillstrip.win{border-left-color:var(--moss);background:var(--moss-soft)}
.drillstrip.endure{border-left-color:var(--sulphur);background:var(--sulphur-soft)}
.drillico{font-size:22px;line-height:1}
.drilltext{flex:1 1 260px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.drilltext em{font-style:normal;font-family:var(--mono);color:var(--lupine)}
.drillnums{font-family:var(--mono);font-size:12.5px}
.drillneed{font-size:12px;color:var(--slate)}
.drilldots{display:inline-flex;gap:3px;flex-wrap:wrap;margin:2px 0}
.drilldots i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);display:block}
.drilldots i.ok{background:var(--moss);border-color:var(--moss)}
.drilldots i.no{background:var(--rust);border-color:var(--rust)}
.drilldots i.opt{opacity:.45;border-style:dashed}
.drillstrip button{padding:8px 14px;min-height:40px}
.healthcard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:6px 0 14px}
.atrisk{border:1px solid var(--rust);background:var(--rust-soft);padding:10px 12px;border-radius:var(--radius);margin:0 0 16px}
.atrisk h3{margin:0 0 4px;font-family:var(--display);font-size:15px}
.atrisk p{margin:0 0 8px;font-size:12.5px;color:var(--slate)}
.atrisk .chips{margin-top:4px}
button.chip.drillme{cursor:pointer;border-color:var(--rust);color:var(--rust);background:var(--sheet);
  min-height:40px;padding:6px 12px}
button.chip.drillme:hover{background:var(--rust);color:#fff}
button.chip.drillme i{font-style:normal;font-size:11px;margin-left:5px}
.chip.word.weak{border-color:var(--rust);background:var(--rust-soft);color:var(--rust);font-weight:600}
.chip.word.weak::before{content:"⚠ ";font-size:10px}
.chip.word .saved{margin-left:4px;font-size:11px}
.board td.health{color:var(--slate)}

/* ---- v6.7: Lesefni ---- */
nav.tabs button[data-view="lessons"]{--tab:var(--rust)}
.lsnwrap{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.lsnindex{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
.lsnindex .sub{margin:0 0 8px}
.lsngroup{margin:0 0 12px}
.lsngroup h4{margin:0 0 4px;font-family:var(--body);font-size:11.5px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.04em}
.lsnitem{display:flex;justify-content:space-between;gap:6px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:5px 8px;font-family:var(--body);font-size:13.5px;color:var(--ink);cursor:pointer;min-height:40px;align-items:center}
.lsnitem:hover{background:var(--paper-2);border-left-color:var(--line)}
.lsnitem.on{background:var(--sheet);border-left-color:var(--rust);font-weight:600}
.lsnitem i{font-style:normal;color:var(--moss);font-size:12px}
.lsnpage{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px;max-width:760px;line-height:1.6;font-size:15.5px}
.lsntitle{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.01em;margin:4px 0 6px;line-height:1.2}
.lsnlead{font-size:16.5px;color:var(--slate);margin:0 0 14px}
.lsnh{font-family:var(--display);font-size:18px;font-weight:600;margin:22px 0 4px}
.lsnpage p{margin:8px 0}
.lsnlist{margin:6px 0 6px 20px;padding:0}
.lsnlist li{margin:3px 0}
.lsnex,.lsntip,.lsnwarn{margin:12px 0;padding:9px 13px;border-radius:var(--radius);font-size:14.5px}
.lsnex{background:var(--paper-2);border:1px dashed var(--line)}
.lsnex ul{margin:2px 0 0 18px;padding:0}
.lsntip{background:var(--moss-soft);border-left:4px solid var(--moss)}
.lsnwarn{background:var(--sulphur-soft);border-left:4px solid var(--sulphur)}
.lsnlabel{display:block;font-size:11.5px;color:var(--slate);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.lsntable{margin:14px 0;overflow-x:auto}
.lsntable figcaption{font-size:12.5px;color:var(--slate);margin-top:4px}
.lsntable .lsnsrc{font-size:11px;color:var(--slate);margin:2px 0 0}
.lsncheck details{border:1px solid var(--line);border-radius:var(--radius);padding:7px 11px;margin:6px 0;background:var(--paper-2)}
.lsncheck summary{cursor:pointer;font-weight:500}
.lsncheck details[open] p{color:var(--moss);font-weight:600}
.lsnrel{font-size:14px}
.lessonlink{background:none;border:0;padding:0 4px;margin:0 0 0 6px;font:inherit;font-size:12px;
  color:var(--rust);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;min-height:40px;
  text-decoration:underline dotted;text-underline-offset:3px;vertical-align:middle}
.lsnrel .lessonlink,.lessonhint .lessonlink,.tiplesson .lessonlink{margin:0 6px 0 0;font-size:inherit}
.lessonlink:hover{color:var(--ink)}
.lessonhint{font-size:13.5px;margin:10px 0 0}
.tiplesson{margin:6px 0 2px;font-size:13px}
@media (max-width:820px){
  /* minmax(0,…): a plain 1fr is as wide as its widest word, and the index
     pushed the page 5 px sideways on a 390 px phone (found by item 84's
     pointer at this tab). The count of pages read gets a line of its own. */
  .lsnwrap{grid-template-columns:minmax(0,1fr)}
  .lsnindex{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:4px 14px}
  .lsnindex .sub{flex:1 1 100%}
  .lsngroup{flex:1 1 200px}
  .lsnpage{padding:16px 16px}
}

/* ---- v6.7: duels ---- */
.drillstrip.duel{border-left-color:var(--lupine);background:var(--lupine-soft)}
.drillstrip.duel.offer{border-left-color:var(--sulphur);background:var(--sulphur-soft)}
.drillstrip.duel.win{border-left-color:var(--moss);background:var(--moss-soft)}
.drillstrip.duel.endure{border-left-color:var(--slate);background:var(--paper-2)}
.drillstrip.duel .drilldots i.due{opacity:.6}
#duelbar .drillstrip + .drillstrip{margin-top:8px}
.duelmore{font-size:12.5px;color:var(--chalk-dim);margin:6px 0 0}
.duelform{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:6px 0 14px;padding:12px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--sheet)}
.duelform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--slate)}
.duelform select{font:inherit;font-size:14px;padding:7px 8px;min-height:38px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);color:var(--ink)}
.duelsize{display:flex;gap:4px}
.duelsize button{min-width:46px;min-height:38px;border:1px solid var(--line);background:var(--paper-2);border-radius:var(--radius);font-family:var(--mono);cursor:pointer}
.duelsize button[aria-pressed="true"]{background:var(--lupine);border-color:var(--lupine);color:var(--on-accent)}
.duelform #duelmsg{flex-basis:100%;margin:0}
button.go.small{padding:4px 10px;min-height:30px;font-size:12.5px}
table.board.duels td{font-size:13.5px}
.dueltag{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--rust);border:1px solid var(--rust-soft);
  background:var(--rust-soft);border-radius:99px;padding:1px 6px;margin-left:4px}
@media (max-width:600px){
  /* v6.7: five tabs on a phone — the long names lose their second half. */
  .tablong{display:none}
  nav.tabs button{white-space:nowrap;padding-left:4px;padding-right:4px}
}

/* ---------- error reports (v6.8, ui/reports.js) -------------------------- */
#reports:empty{display:none}
.reportflag{background:none;border:1px solid transparent;border-radius:99px;padding:0 6px;margin:0 0 0 4px;
  font-size:13px;line-height:1.6;cursor:pointer;opacity:.55;filter:grayscale(.6);transition:opacity .15s,filter .15s,border-color .15s}
.reportflag:hover,.reportflag:focus-visible{opacity:1;filter:none;border-color:var(--line)}
.rpwhich{display:grid;gap:8px;margin:0 0 14px}
.rpwhich label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rpwhich input{margin-top:13px}
.rpwhich label span,.rpwhich.single span{flex:1;display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--paper-2)}
.rpwhich input:checked + span{border-color:var(--lupine);background:var(--lupine-soft)}
.rpq{color:var(--slate)}
.rpkinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:0 0 14px}
.rpkind{display:flex;gap:8px;align-items:stretch;cursor:pointer;font-size:13.5px}
.rpkind input{margin-top:12px}
.rpkind span{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.rpkind input:checked + span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rpkind small{display:block;color:var(--slate);font-size:12px;line-height:1.35;margin-top:2px}
.rplabel{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.rplabel small{font-weight:400;color:var(--slate)}
.sheetbody textarea{width:100%;font-family:var(--body);font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);resize:vertical}
.sheetbody .answer{margin-top:14px}
.rpfilter{align-items:center}
.rpfilter #rpdownload{margin-left:auto}
.rpitem{border-top:1px solid var(--line);padding:8px 0}
.rpitem summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.rpsum{flex:1 1 220px;color:var(--ink)}
.rpmeta{font-size:12px;color:var(--slate)}
.rpst{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--paper);color:var(--slate)}
.rpst.st-ny{background:var(--sulphur-soft);color:#7A5900}
.rpst.st-villa{background:var(--rust-soft);color:var(--rust)}
.rpst.st-lagad{background:var(--moss-soft);color:var(--moss)}
.rpbody{padding:10px 0 4px 4px}
.rpnote{font-size:15px;border-left:3px solid var(--lupine);padding:4px 10px;margin:0 0 10px;background:var(--paper-2)}
.rpdl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13.5px;margin:0 0 10px}
.rpdl dt{color:var(--slate)}
.rpdl dd{margin:0}
.rpwrong{color:var(--rust)}
.rppre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--paper-2);border:1px solid var(--line);padding:10px;max-height:340px;overflow:auto}
table.rptok tr.on td{background:var(--sulphur-soft);font-weight:600}
.rpactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.rpactions input[type=text]{flex:1 1 220px;font-family:var(--body);font-size:16px;padding:7px 10px}
.rpactions select{font:inherit;font-size:16px;padding:5px}

/* ---------- Málbeiting (v6.9): villuveiðar, setningasmiðja, umritun ---------- */
.hunt{font-size:clamp(17px,2.4vw,20px);line-height:1.75;margin:4px 0 0}
.hunt.plain .huntline{margin:0 0 10px;font-family:var(--display);font-weight:500}
.hunt.plain .huntline + .huntline{padding-top:10px;border-top:1px dashed var(--line)}
.huntw{cursor:pointer;border-bottom:2px dotted var(--line);padding:0 1px;border-radius:2px}
.huntw:hover,.huntw:focus-visible{background:var(--lupine-soft);color:var(--ink);outline:none}
.huntw.sel{background:var(--sulphur-soft);border-bottom:2px solid var(--sulphur);color:var(--ink)}
.huntw.right{background:var(--moss-soft);color:var(--moss);border-bottom:2px solid var(--moss);font-weight:600}
.huntw.missed{background:var(--rust-soft);color:var(--rust);border-bottom:2px solid var(--rust);font-weight:600}
.huntw.wrongpick{text-decoration:line-through;color:var(--rust)}
.huntedits{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.huntedit{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.huntedit .arrow{color:var(--slate)}
.huntedit input[type=text]{flex:0 1 260px;font-size:17px;padding:8px 10px}
.huntedit .undo{padding:6px 10px}
ul.huntlist{list-style:none;padding:0;margin:8px 0 0}
ul.huntlist li{margin:0 0 9px}
ul.huntlist .mk{display:inline-block;width:1.4em;font-weight:700}
ul.huntlist .mk.ok{color:var(--moss)} ul.huntlist .mk.no{color:var(--rust)}
.huntwhy{font-size:13px;color:var(--slate);margin-left:1.4em;display:inline-block}
.wcards{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin:4px 0 0}
.wcard{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.6vw,23px);background:var(--sheet);border:1px solid var(--ink);border-bottom-width:3px;border-radius:6px;padding:5px 12px 4px;line-height:1.2;text-align:center}
.wcard small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--slate)}
.wcard.right{border-color:var(--moss);background:var(--moss-soft)}
.wcard.wrongpick{border-color:var(--rust);background:var(--rust-soft)}
.wdash{color:var(--slate)}

/* ---------- practice sessions (v6.10, ui/session.js) ---------- */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:6px 0 0}
.topic{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;cursor:pointer;
  font-family:var(--body);color:var(--ink);background:var(--sheet);border:1px solid var(--line);
  border-radius:6px;padding:11px 13px 12px;min-height:96px}
.topic:hover{border-color:var(--chalk-yellow)}
.topic[aria-pressed="true"]{border:2px solid var(--chalk-yellow);background:var(--lupine-soft);padding:10px 12px 11px}
.topic.mine{border-style:dashed}
.topicico{font-size:22px;line-height:1}
.topicnm{font-family:var(--display);font-weight:600;font-size:17px}
.topicnm small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--slate)}
.topicds{font-size:12.5px;color:var(--slate);line-height:1.35}
.topicflag{font-size:11.5px;color:var(--rust);font-weight:600}
.runsize{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.runsize span{color:var(--slate);font-size:14px}
.sizeb{font-family:var(--display);font-weight:600;font-size:17px;min-width:56px;padding:8px 12px;cursor:pointer;
  background:none;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius)}
.sizeb[aria-pressed="true"]{border:2px solid var(--chalk-yellow);background:var(--lupine-soft)}
.runnote{font-size:13.5px;color:var(--slate);margin:16px 0 0;max-width:80ch}
.runnote.warn{color:var(--rust)}
.runhist{margin-top:12px;font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.runchip{display:inline-block;font-size:12.5px;border:1px solid var(--line);border-radius:12px;padding:2px 9px;background:var(--sheet)}
@media (max-width:600px){
  /* v6.10: eleven tall cards put "Byrja lotu" far below the screen. Two
     columns, no description, and the start button stays in reach. */
  .topics{grid-template-columns:1fr 1fr;gap:6px}
  .topic{min-height:0;padding:8px 10px}
  .topic[aria-pressed="true"]{padding:7px 9px}
  .topicds{display:none}
  .topicnm{font-size:15px}
  .runpick .answer{position:sticky;bottom:0;z-index:5;background:var(--paper);padding:8px 0;margin-bottom:-8px}
}
.drillstrip.runstrip{border-left-color:var(--chalk-yellow);background:var(--paper-2)}
/* v6.13 (item 21): today's session is the one big button; the categories
   below it are the second thing on the board. */
.todaybox{margin:0 0 4px}
.todaybox .answer{margin-top:6px}
button.todaygo{font-size:18px;padding:14px 28px}
.todayline{font-size:14px;color:var(--slate);margin:10px 0 0;max-width:70ch}
.ownpick.second{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}
.ownpick.second .topic{min-height:80px}
/* v6.13 (item 36): "Þrjár í röð" — the offer under a verdict, and the rule. */
.streakoffer{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.streakoffer p{margin:0 0 8px;font-size:14px}
.streakintro .rule{font-size:16px;max-width:70ch}
/* The verdict is paper on the board: its buttons are ink, not chalk. */
.blackboard .verdict .streakoffer button.ghost{background:var(--sheet);color:var(--ink);border-color:var(--ink)}
.blackboard .verdict .streakoffer button.ghost:hover{background:var(--lupine-soft)}
@media (max-width:600px){
  .todaybox .answer{position:static;margin-bottom:0}
  button.todaygo{width:100%}
  /* The category's start button is the secondary one now (no fill of its
     own), so the strip it sticks in must hide the cards scrolling under it. */
  .ownpick.second .answer{background:var(--board)}
}

/* ---- v6.13 (atriði 2, 47, 48): spurningin fær skjáinn ----
   Á meðan lota stendur yfir víkur allt sem er ofan við spurninguna — nafnið,
   tölurnar fjórar, stigaslánin, fliparnir, dagsetningin — fyrir einni mjórri
   línu á töflunni: efni, 3/10 og lítill ×. Í 390 px síma byrjaði spurningin
   590 px niðri. Samantektin sýnir allt aftur. ui/session.js setur klasann,
   og aðeins meðan taflan sjálf er opin (📖-tengill í spurningu opnar
   Lesefni, og þar eru fliparnir leiðin til baka). */
body.insession .topbar,body.insession .levelbar,body.insession .levelmeta,
body.insession nav.tabs,body.insession .boardhead,body.insession footer{display:none}
body.insession .wrap{padding-top:10px}
body.insession .blackboard{padding-top:8px}
.runline{position:relative;display:flex;align-items:center;gap:10px;min-height:40px;
  padding:2px 0 4px;border-bottom:1px dashed var(--line);font-size:14px;color:var(--chalk-dim)}
.runico{font-size:17px;line-height:1;flex:0 0 auto}
.runtopic{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--display);font-weight:600;color:var(--chalk)}
.rundots{flex:0 1 auto;flex-wrap:nowrap;margin:0}
.runcount{flex:0 0 auto;font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.runcount b{color:var(--chalk);font-weight:600}
/* Hætta, sem var stærsti hnappurinn á skjánum: nú lítill × aftast í línunni.
   Hann spyr enn hvort barnið vilji hætta (confirmQuit). */
.runx{flex:0 0 auto;width:34px;height:34px;padding:0;display:inline-grid;place-items:center;
  background:none;border:1px solid transparent;border-radius:var(--radius);
  color:var(--chalk-dim);font-family:var(--body);font-size:22px;line-height:1;cursor:pointer}
.runx:hover,.runx:focus-visible{border-color:var(--line);color:var(--chalk)}
/* Krítarstrik sem sýnir hve langt er komið — í síma í stað punktanna. */
.runprog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--chalk-yellow);display:none}
@media (max-width:600px){
  .rundots,.runok{display:none}
  .runprog{display:block}
}
@media (pointer:coarse){ .runx{width:44px;height:44px} }
.drilldots i.now{border-color:var(--chalk-yellow);box-shadow:0 0 0 2px rgba(242,217,107,.35)}
.drilldots i.due{opacity:.55}
.diagline{margin:8px 0 0;font-size:13.5px}
.summary .sumhead{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 10px}
.sumscore{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 16px;min-width:110px}
.sumscore b{display:block;font-family:var(--display);font-size:34px;line-height:1.1}
.sumscore b small{font-size:18px;color:var(--slate)}
.sumscore span{font-size:12.5px;color:var(--slate)}
.sumscore.xp b{color:var(--chalk-yellow)}
.sumdots{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 10px}
.sumdots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:block}
.sumdots i.ok{background:var(--moss);border-color:var(--moss)}
.sumdots i.no{background:var(--rust);border-color:var(--rust)}
.sumdots i.opt{opacity:.5;border-style:dashed}
.sumbadges{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.sumearlier{font-size:.88em;color:var(--slate);margin:0 0 8px;line-height:1.9}
.sumsec{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.sumsec h3{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 6px}
.sumsec ul{margin:0;padding-left:20px}
.sumsec li{margin:0 0 4px;font-size:14.5px}

/* ---------- the guided first run (item 84, ui/tour.js) ----------------------
   Two shapes, both chalk on a board with a wooden frame, like the Æfa tab:
   a CARD in the middle of the screen (the welcome, the placement round's
   introduction, what it found) and a POINTER — a dashed chalk ring round a
   real element of the page, with a small board beside it that says what the
   element is for. Everything is laid out from the viewport's own width
   (`position:fixed`, widths in `min()`), so nothing can push the page
   sideways on a 390 px phone. Motion: the ring's slow pulse and its glide
   from one element to the next; the reduced-motion rule above stops both. */
.tour{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:90}
.tour button:focus-visible{outline:2px solid var(--chalk-yellow);outline-offset:2px}
.tourscrim{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:28px 16px 48px;background:rgba(15,23,32,.62)}
.tourcard.blackboard:focus{outline:none}
.tourcard.blackboard{margin:auto;width:100%;max-width:540px;padding:26px 30px 26px;border-radius:6px 6px 0 0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 3px 14px rgba(0,0,0,.28),0 18px 50px rgba(0,0,0,.35);
  animation:tourin .28s ease-out}
.tourcard.blackboard.wide{max-width:650px}
@keyframes tourin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tour h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0;color:var(--chalk)}
.tourline{display:block;width:min(220px,70%);height:10px;margin:6px 0 14px}
.tourline path{fill:none;stroke:var(--chalk-yellow);stroke-width:2.4;stroke-linecap:round;opacity:.9}
.tourtext{font-size:16px;line-height:1.6;color:var(--chalk)}
.tourtext p{margin:0 0 10px}
.tourtext p:last-child{margin-bottom:0}
.tourtext b{color:var(--chalk-yellow);font-weight:600}
/* The four cases of "þú", as the tagline has the four cases of "skóli". */
.tourchant{font-family:var(--mono);font-size:13.5px;color:var(--chalk-dim);letter-spacing:.01em}
.tourchant b{color:var(--chalk-yellow);font-weight:600}
.tourask{font-family:var(--display);font-weight:700;font-size:19px;margin:20px 0 0;color:var(--chalk)}
.touryears{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0}
.touryear{position:relative;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;color:var(--chalk);
  background:rgba(243,241,231,.06);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 6px 12px;min-height:72px;cursor:pointer}
.touryear small{display:block;margin-top:4px;font-family:var(--body);font-weight:500;font-size:13px;color:var(--chalk-dim)}
.touryear em{display:block;margin-top:5px;font-family:var(--body);font-style:normal;font-weight:600;font-size:11.5px;
  letter-spacing:.02em;color:var(--chalk-yellow)}
.touryear:hover:not(:disabled){border-color:var(--chalk);background:rgba(243,241,231,.1)}
.touryear[aria-pressed="true"]{border:2px solid var(--chalk-yellow);background:var(--lupine-soft);padding:13px 5px 11px}
.touryear:disabled{opacity:.42;cursor:default}
.touryear.wide{grid-column:1/-1;font-family:var(--body);font-weight:600;font-size:15px;min-height:48px;padding:10px}
.touryearline{font-size:15px;line-height:1.55;margin:18px 0 0;padding-top:14px;border-top:1px dashed var(--line);color:var(--chalk)}
.touryearline b{color:var(--chalk-yellow);font-weight:600}
.touractions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tourskip{display:block;margin:10px 0 -8px -6px;padding:10px 6px;min-height:44px;background:none;border:none;cursor:pointer;
  font-family:var(--body);font-size:13.5px;color:var(--chalk-dim);text-decoration:underline;text-underline-offset:3px}
.tourskip:hover{color:var(--chalk)}
/* What the round found: one row per category, the level as chalk strokes. */
.tourcap{display:flex;justify-content:space-between;margin:16px 0 0;font-size:12.5px;color:var(--chalk-dim)}
.tourcap + .tourlevels{margin-top:6px}
.tourlevels{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:7px 26px}
.tourlevels li{display:flex;align-items:center;gap:8px;min-width:0;font-size:14.5px}
.tourlevels .tln{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tourlevels .tln i{font-style:normal;margin-right:2px}
.tourlevels .tlm{flex:0 0 auto;display:inline-flex;gap:3px}
.tourlevels .tlm i{display:block;width:7px;height:15px;border-radius:2px;background:rgba(243,241,231,.16)}
.tourlevels .tlm i.on{background:var(--chalk-yellow)}
.tourlevels .tlv{flex:0 0 auto;width:1.2em;text-align:right;font-family:var(--mono);font-size:13px;color:var(--chalk-dim)}

/* The pointer. The shade takes every click that is not on the small board;
   the ring's own shadow is what dims the page, so the element inside it
   stays as bright as it was. */
.tourshade{position:fixed;top:0;right:0;bottom:0;left:0;inset:0}
.tourring{position:fixed;pointer-events:none;border:2px dashed var(--chalk-yellow);border-radius:10px;
  box-shadow:0 0 0 200vmax rgba(15,23,32,.6);transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
.tourring::after{content:"";position:absolute;top:-7px;right:-7px;bottom:-7px;left:-7px;border:2px solid rgba(242,217,107,.55);
  border-radius:15px;animation:tourpulse 1.9s ease-in-out infinite}
@keyframes tourpulse{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.9;transform:scale(1.015)}}
.tourtip.blackboard{position:fixed;left:12px;top:12px;width:min(400px,calc(100vw - 24px));margin:0;padding:14px 18px 12px;
  border:7px solid var(--wood);border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 3px 14px rgba(0,0,0,.28),0 14px 36px rgba(0,0,0,.4)}
.tourtip h2{font-size:21px;margin:0 0 6px}
.tourtip .tourtext{font-size:15px;line-height:1.55;margin:0}
.tourtip .touractions{margin-top:14px}
.tourtip button.go{padding:11px 16px}
.tourtip button.ghost{padding:10px 12px}
.tourtip .tourskip{margin-top:6px}
.toureyebrow{display:flex;justify-content:space-between;gap:10px;margin:0 0 6px;font-size:12.5px;color:var(--chalk-dim)}
.toureyebrow b{font-family:var(--mono);font-weight:500;color:var(--chalk-yellow)}
.tourarrow{position:absolute;left:var(--ax,50%);width:18px;height:18px;margin-left:-9px;background:var(--wood);
  transform:rotate(45deg);display:none}
.tourtip.below .tourarrow{display:block;top:-15px}
.tourtip.above .tourarrow{display:block;bottom:-15px}
.tourtip.right .tourarrow,.tourtip.left .tourarrow{display:block;top:var(--ay,50%);margin:-9px 0 0}
.tourtip.right .tourarrow{left:-15px}
.tourtip.left .tourarrow{left:auto;right:-15px}
/* A low window (a phone on its side): the same board, set tighter. */
@media (max-height:480px){
  .tourtip.blackboard{padding:10px 14px 8px;border-width:5px}
  .tourtip h2{font-size:18px;margin-bottom:3px}
  .tourtip .tourtext{font-size:14px;line-height:1.45}
  .tourtip .touractions{margin-top:9px}
  .tourtip .tourskip{margin-top:2px;min-height:36px;padding:6px}
  .toureyebrow{margin-bottom:3px}
}
@media (max-width:600px){
  .tourscrim{padding:14px 10px 40px}
  .tourcard.blackboard{padding:20px 18px 20px;border-width:7px}
  .tour h2{font-size:24px}
  .tourtext{font-size:15.5px}
  .tourlevels{grid-template-columns:1fr}
  .tourtip h2{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  .tourcard.blackboard,.tourring::after{animation:none}
  .tourring{transition:none}
}
/* ---------- a live class round (v6.13, item 64; ui/live.js) ---------------
   The projector is a full-screen blackboard, so the question on the wall
   looks as it does on every pupil's board, and reads from the back row. */
.liveboard{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;z-index:900;overflow:auto;margin:0;border-radius:0;
  padding:18px 4vw 48px;font-size:clamp(17px,1.6vw,26px)}
body.liveon{overflow:hidden}
.liveboard .lbbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.liveboard .lbmain{max-width:1100px;margin:0 auto}
.liveboard button.big{font-size:1.15em;padding:16px 34px}
.lbtitle{font-family:var(--display);font-size:2.4em;line-height:1.1;margin:.3em 0;color:var(--ink)}
.lbsub{color:var(--slate);margin:.2em 0}

.lbcount{font-size:1.3em;font-weight:700}

.lbclock{font-family:var(--mono);font-size:3em;font-weight:700;min-width:2.2ch}
.drillstrip .lbclock{font-size:1em}
.lbtop{list-style:none;padding:0;margin:16px 0;font-size:1.2em}
.lbtop li{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.lbrank{font-family:var(--mono);min-width:2.5ch}
.lbname{flex:1;font-weight:700}
.lbnums{font-family:var(--mono);color:var(--slate)}

.lbrule{margin:20px 0;padding:14px 18px;border-left:6px solid var(--lupine);background:var(--lupine-soft)}
.lbrule h2{margin:0 0 6px;font-size:1.3em}
.lberr{color:var(--rust)}
/* The card on the wall answers nothing: no Athuga, no hint, no keypad. */
.livecard button.go,.livecard button.ghost,.livecard .keys,.livecard .reportflag,
.livecard .lessonlink,.livecard .workedex{display:none}
/* The pupil's card after answering: hidden, verdict and all, until the
   question closes on every screen (ui/live.js `coverCard`). */
#task .livewaitmsg{display:none}
#task.livewait > :not(.livewaitmsg){display:none}
#task.livewait > .livewaitmsg{display:block;padding:28px 12px;text-align:center;font-size:1.15em}
#task.livedone #check{display:none}
.drillstrip.live{border-left-color:var(--lupine);background:var(--lupine-soft)}
.drillstrip.live.offer{border-left-color:var(--moss);background:var(--moss-soft)}

/* Item 45: the second-language mode (ui/secondlang.js). A glossed word in
   the sentence keeps the sentence's own type; the dotted line is the only
   sign, and a tap opens the same window as any other definition. The speak
   button sits under the sentence and is never drawn without a voice. */
.sentence .l2w{cursor:pointer;border-bottom-color:var(--moss)}
.l2speakrow{margin:-4px 0 10px}
.l2speak{font-size:14px;padding:6px 12px;min-height:40px}

   an assignment; the card is a question card with a text box. A remark marks
   its stretch in the sentence it is in, in the moss of a definition. */
.writebox{margin:0 0 14px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.writebox.done{opacity:.8}
.writecard textarea{width:100%;box-sizing:border-box;min-height:7.5em;font:inherit;font-size:17px;line-height:1.5;
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);caret-color:currentColor;resize:vertical}
/* Owner feedback 6.13: on the board `color:inherit` was chalk on a white box. The box takes the
   sheet and ink of where it stands: chalk on the translucent board, ink on white paper. */
.writecard textarea:focus{outline:2px solid var(--moss);outline-offset:1px}
.wrcount{margin:4px 0 8px;font-size:13px}
.wrmode{font-size:14px;margin:4px 0}
.wrself{margin:2px 0 10px 18px;font-size:14px}

.wrmsg{margin:6px 0 2px}

:root,.blackboard .verdict{

  --sc-clause:#55657A; --sc-clause-bg:rgba(85,101,122,.07);

.blackboard{

  --sc-sagnfylling:#F2D96B; --sc-fl:#8FE0EE; --sc-st:#F3F1E7;
  --sc-clause:#A9BAAF; --sc-clause-bg:rgba(243,241,231,.06);
}

.sentence.readtext{font-size:clamp(18px,2.6vw,22px);line-height:1.55;margin-bottom:.8em;max-width:38em}
.sc{display:inline-flex;flex-direction:column;align-items:center;max-width:100%;margin:0 3px;--c:var(--slate)}
.sc-w{padding:0 2px 1px;border-bottom:3px solid var(--c)}
.sc-name,.sc-cname{font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.02em;line-height:1.25;
  white-space:nowrap;-webkit-user-select:none;user-select:none}
.sc-name{color:var(--c);margin-top:3px}
.sc .pickw{border-bottom:none}
.sc-frumlag{--c:var(--sc-frumlag)}
.sc-umsogn{--c:var(--sc-umsogn)}
.sc-umsogn .sc-w{border-bottom:6px double var(--c)}
.sc-andlag{--c:var(--sc-andlag)}
.sc-andlag .sc-w{border-bottom:3px dashed var(--c)}
.sc-obeint-andlag{--c:var(--sc-obeint)}

.sc-sagnfylling{--c:var(--sc-sagnfylling)}

  text-decoration:underline wavy var(--c);text-decoration-thickness:2px;text-underline-offset:.2em}

.sc-samtenging{--c:var(--sc-st)}
.sc-samtenging .sc-w{border:2px solid var(--c);border-radius:99px;padding:0 8px}
.sc-clause{display:inline-block;max-width:100%;vertical-align:baseline;border:2px dashed var(--sc-clause);border-radius:8px;
  padding:1px 8px 5px;margin:3px 0;background:var(--sc-clause-bg)}
.sc-cname{display:block;color:var(--sc-clause);margin:1px 0 0}
